<!DOCTYPE html>
<html>
<head>
    <title>SmartNote AI</title>
    <style>
    body {
        font-family: Arial;
        background: linear-gradient(to right, #43cea2, #185a9d);
        text-align: center;
        padding: 20px;
    }

    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 15px;
        width: 60%;
        margin: auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    textarea {
        width: 90%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    input[type="file"] {
        margin: 10px;
    }

    button {
        padding: 12px 25px;
        background: linear-gradient(to right, #ff7e5f, #feb47b);
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: linear-gradient(to right, #ff512f, #dd2476);
        transform: scale(1.05);
    }

    h1 {
        color: #333;
    }

    .summary {
        margin-top: 20px;
        background: linear-gradient(to right, #fbc2eb, #a6c1ee);
        padding: 20px;
        border-radius: 10px;
        color: #333;
        font-weight: 500;
    }
</style>
</head>

<body>

    <div class="container">
        <h1>SmartNote AI</h1>

        <form method="POST" enctype="multipart/form-data">

            <h3>Enter Text:</h3>
            <textarea name="text" rows="8" placeholder="Enter your text here..."></textarea>

            <h3>OR Upload PDF:</h3>
            <input type="file" name="pdf">

            <br>
            <button type="submit">Summarize</button>
        </form>

        <div class="summary">
            <h2>Summary:</h2>
            <p>{{ summary }}</p>
        </div>
    </div>

</body>
</html>
